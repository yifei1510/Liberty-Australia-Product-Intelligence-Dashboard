<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Little Millet: economic cost composition</title>
<desc id="chart-desc">Revised indicative Base sea LCL economic cost for a 5,000 kilogram shipment is AUD 13,247.38. Goods represent 59.8%, freight and insurance 17.4%, compliance and government 7.0%, and destination and delivery 15.9%, rounded independently.</desc>
