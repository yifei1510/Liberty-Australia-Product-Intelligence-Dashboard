<text x="60.00" y="519.00" fill="#617182" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Conditional: plain-food import GST 0%; the model assumes full recovery of AUD 245.00 local-service GST.</text>
<text x="60.00" y="545.00" fill="#617182" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Source: v4 Cost Build!W26:AC26; tax inputs: Cost Inputs!AD26:AJ26. Revised indicative.</text>
