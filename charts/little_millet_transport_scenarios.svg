<rect x="220.0" y="158.0" width="183.8" height="55.0" rx="0" fill="#238B87"/>
<text x="417.8" y="194.0" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start">2.625</text>
<text x="188.0" y="281.0" fill="#233142" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="end">Sea FCL</text>
