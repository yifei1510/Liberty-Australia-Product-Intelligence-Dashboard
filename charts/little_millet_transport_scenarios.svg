<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Little Millet transport alternatives</title>
<desc id="chart-desc">Three zero-based bars showing 5,000 kilogram modeled economic cost per kilogram: sea LCL 2.625, sea FCL 3.379, and air 10.138 Australian dollars.</desc>
